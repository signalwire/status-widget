name: Deploy demo to Pages

# Publishes demo/ to GitHub Pages. The demo reads its snapshot from
# raw.githubusercontent.com rather than from a copy deployed alongside it, so
# the page stays current between Pages deploys and needs no redeploy when the
# status changes.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/**'
      - 'scripts/build.mjs'
      - 'scripts/deploy-demo.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy, but only keep one queued behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build widget and assemble demo
        run: |
          node scripts/build.mjs
          node scripts/deploy-demo.mjs --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
